<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="8"/>
  <!-- Hexagon Outer Shape -->
  <path d="M 256 60 L 420 155 L 420 345 L 256 440 L 92 345 L 92 155 Z" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#neonGlow)" />
  <!-- Stylized "P" & "C" Emblem -->
  <path d="M 170 140 L 270 140 C 330 140, 330 230, 270 230 L 170 230 L 170 370" fill="none" stroke="#00f2fe" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 250 280 L 320 280 C 350 280, 350 370, 290 370 L 220 370" fill="none" stroke="#00f5d4" stroke-width="22" stroke-linecap="round"/>
  <!-- Core Energy Gem -->
  <circle cx="256" cy="256" r="16" fill="#00f2fe" filter="url(#neonGlow)" />
</svg>
